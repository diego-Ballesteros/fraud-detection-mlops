# Ruff and mypy run through `uv run`, so they use the exact versions locked in uv.lock,
# the same ones CI uses. Pinning them here as separate repos would let the two diverge,
# and an isolated mypy environment would not see pandas or pydantic.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # data/ is gitignored, but a heavy artifact anywhere else would slip through.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # One file, not a higher global limit: the monitoring report is the declared
        # deliverable of the 30% component (ADR 0012), and an evaluator who clones the repo
        # cannot regenerate it without the CSV, which is not versioned. About 4 MB, nearly
        # all of it Evidently's embedded JavaScript.
        exclude: ^reports/deliverables/monitoring_report\.html$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy (src/)
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
