name: CI

# push: only the long-lived branches.
# pull_request: deliberately unfiltered. A required check on the protected branch only
# shows up if it runs against the PR's commit, and a mistyped branch filter drops the
# event silently, with no visible error.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync environment from uv.lock
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest -v
